<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran Lomba</title>
   
</head>
<style>
    body {font-family: sans-serif;
    background: #fce; color: blueviolet;
    text-align: center; padding: 30px; }
    
</style>
<body>
    <h1>Formulir Pendaftaran</h1>
    <form action="formulir2.html" method="post">
        <label for="nama">nama:</label><br>
        <input type="text" id="nama" name="nama"
        required><br><br>
        <label for="email">email:</label><br>
        <input type="text" id="email" name="email"
        required><br><br>
        <label for="jenis kelamin">jenis kelamin</label><br>
        <input type="radio" id="laki" name="jenis kelamin" value="laki-laki">
        <label for="laki">laki-laki</label><br>
        <input type="radio" id="perempuan" name="jenis kelamin" value="perempuan">
        <label for="perempuan">perempuan </label><br><br><br>

        <label for="pesan">pesan:</label><br>
        <textarea id="pesan" name="pesan" rows="4" cols="30"></textarea><br>
        <br>
        <input type="submit" value="kirim">

    </form>
</body>
</html>
